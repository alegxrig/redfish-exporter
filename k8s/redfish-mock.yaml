apiVersion: apps/v1
kind: Deployment
metadata:
  name: redfish-mock
  labels:
    app: redfish-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redfish-mock
  template:
    metadata:
      labels:
        app: redfish-mock
    spec:
      containers:
        - name: redfish-mock
          image: dmtf/redfish-mockup-server:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: redfish-mock
spec:
  selector:
    app: redfish-mock
  ports:
    - port: 8000
      targetPort: 8000

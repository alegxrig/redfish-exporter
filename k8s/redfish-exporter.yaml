apiVersion: apps/v1
kind: Deployment
metadata:
  name: redfish-exporter
  labels:
    app: redfish-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redfish-exporter
  template:
    metadata:
      labels:
        app: redfish-exporter
    spec:
      containers:
        - name: redfish-exporter
          image: redfish-exporter:local
          imagePullPolicy: Never
          ports:
            - containerPort: 9812
          envFrom:
            - configMapRef:
                name: redfish-exporter-config
          env:
            - name: REDFISH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redfish-exporter-secret
                  key: REDFISH_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: redfish-exporter
spec:
  selector:
    app: redfish-exporter
  ports:
    - port: 9812
      targetPort: 9812
